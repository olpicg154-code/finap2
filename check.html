<div class="logo">

<h1>⚠️ Перевірка контрагента</h1>

<div class="subtitle">
    Перевірка за відкритими санкційними та ризиковими даними
</div>

<div class="search-box">

    <input
        id="name"
        type="text"
        placeholder="Введіть ім’я або назву компанії"
        autocomplete="off"
    >

    <button id="checkButton" onclick="check()">
        Перевірити
    </button>

</div>

<a class="back" href="index.html">
    ← Назад
</a>
```

</div>

<script>

async function check() {

    const input = document.getElementById("name");
    const resultEl = document.getElementById("result");
    const button = document.getElementById("checkButton");

    const name = input.value.trim();

    if (!name) {

        resultEl.innerHTML = `
            <div class="error">
                Введіть ім’я або назву компанії.
            </div>
        `;

        input.focus();
        return;
    }

    button.disabled = true;

    resultEl.innerHTML = `
        <div class="loading">
            🔎 Перевіряємо відкриті дані...
        </div>
    `;

    try {

        const response = await fetch(
            "/api/check?name=" +
            encodeURIComponent(name)
        );

        if (!response.ok) {
            throw new Error("API HTTP " + response.status);
        }

        const data = await response.json();

        console.log("FinAP API:", data);

        const results = Array.isArray(data.results)
            ? data.results
            : [];

        if (results.length === 0) {

            resultEl.innerHTML = `
                <div class="summary summary-safe">

                    <div class="summary-title">
                        ✅ Ризикових збігів не знайдено
                    </div>

                    <div class="summary-subtitle">
                        За поточним пошуком у доступних відкритих
                        даних релевантних збігів не виявлено.
                    </div>

                </div>
            `;

            return;
        }

        const sanctions = results.filter(
            item => item.sanctions === true
        );

        const pep = results.filter(
            item =>
                item.sanctions !== true &&
                item.pep === true
        );

        const otherRisk = results.filter(
            item =>
                item.sanctions !== true &&
                item.pep !== true &&
                (
                    item.wanted === true ||
                    (
                        Array.isArray(item.topics) &&
                        item.topics.some(topic =>
                            topic === "crime.war" ||
                            topic === "wanted" ||
                            topic === "sanction"
                        )
                    )
                )
        );

        let summaryClass = "summary-safe";
        let summaryTitle = "🟢 ЯВНИХ РИЗИКІВ НЕ ВИЯВЛЕНО";
        let summaryDescription =
            "Санкційних, PEP або інших критичних ризикових збігів не виявлено.";

        if (
            sanctions.length > 0 ||
            otherRisk.length > 0
        ) {

            summaryClass = "summary-danger";
            summaryTitle = "🔴 ВИСОКИЙ РИЗИК";
            summaryDescription =
                "Виявлено санкційний або інший критичний ризиковий збіг.";

        } else if (pep.length > 0) {

            summaryClass = "summary-warning";
            summaryTitle = "🟠 ПІДВИЩЕНИЙ РИЗИК";
            summaryDescription =
                "Виявлено політично значущу особу (PEP). Санкційних збігів не виявлено.";
        }

        let html = `

            <div class="summary ${summaryClass}">

                <div class="summary-title">
                    ${summaryTitle}
                </div>

                <div class="summary-subtitle">
                    ${escapeHtml(summaryDescription)}
                </div>

                <div class="summary-subtitle" style="margin-top:10px;">
                    Знайдено результатів: ${results.length}
                    ${sanctions.length > 0
                        ? " · Санкційних: " + sanctions.length
                        : ""}
                    ${pep.length > 0
                        ? " · PEP: " + pep.length
                        : ""}
                    ${otherRisk.length > 0
                        ? " · Інших ризикових: " + otherRisk.length
                        : ""}
                </div>

            </div>
        `;

        results.slice(0, 10).forEach(item => {

            const personName =
                item.name ||
                item.caption ||
                "Без назви";

            let badgeClass = "badge-info";
            let badgeText = "ℹ️ Інформаційний збіг";

            if (item.sanctions === true) {

                badgeClass = "badge-sanctions";
                badgeText = "🔴 САНКЦІЇ";

            } else if (item.pep === true) {

                badgeClass = "badge-pep";
                badgeText = "🟠 PEP";

            } else if (
                item.wanted === true ||
                (
                    Array.isArray(item.topics) &&
                    item.topics.some(topic =>
                        topic === "crime.war" ||
                        topic === "wanted" ||
                        topic === "sanction"
                    )
                )
            ) {

                badgeClass = "badge-risk";
                badgeText = "🟡 ІНШИЙ РИЗИК";
            }

            const country =
                item.country
                    ? item.country.toUpperCase()
                    : "Не вказано";

            const birthDate =
                item.birthDate ||
                "Не вказано";

            const position =
                item.position ||
                "Не вказано";

            const score =
                typeof item.score === "number"
                    ? Math.round(item.score * 100) + "%"
                    : "Не визначено";

            html += `

                <div class="match">

                    <div class="match-name">
                        ${escapeHtml(personName)}
                    </div>

                    <div class="match-score">
                        Рівень збігу: ${score}
                    </div>

                    <div class="risk-badge ${badgeClass}">
                        ${badgeText}
                    </div>

                    <div class="details">

                        <div class="detail">
                            <strong>Країна:</strong>
                            ${escapeHtml(country)}
                        </div>

                        <div class="detail">
                            <strong>Дата народження:</strong>
                            ${escapeHtml(birthDate)}
                        </div>

                        <div class="detail">
                            <strong>Посада / статус:</strong>
                            ${escapeHtml(position)}
                        </div>

                    </div>

                    <div class="status-row">

                        <div class="status ${
                            item.sanctions
                                ? "status-yes"
                                : "status-no"
                        }">
                            ${
                                item.sanctions
                                    ? "❌ Санкції: ТАК"
                                    : "✓ Санкції: НІ"
                            }
                        </div>

                        <div class="status ${
                            item.pep
                                ? "status-pep"
                                : "status-no"
                        }">
                            ${
                                item.pep
                                    ? "⚠️ PEP: ТАК"
                                    : "✓ PEP: НІ"
                            }
                        </div>

                        <div class="status ${
                            item.wanted
                                ? "status-yes"
                                : "status-no"
                        }">
                            ${
                                item.wanted
                                    ? "❌ Розшук: ТАК"
                                    : "✓ Розшук: НІ"
                            }
                        </div>

                    </div>

                    ${
                        Array.isArray(item.datasets) &&
                        item.datasets.length
                            ? `
                                <div class="sources">
                                    <strong>Джерела:</strong>
                                    ${escapeHtml(
                                        item.datasets.join(", ")
                                    )}
                                </div>
                            `
                            : ""
                    }

                </div>
            `;
        });

        html += `

            <div class="disclaimer">

                <strong>Важливо:</strong><br><br>

                Наявність результату пошуку не означає автоматично,
                що знайдена особа або компанія є саме тим контрагентом,
                якого ви перевіряєте.

                Для остаточної ідентифікації необхідно зіставити
                додаткові ідентифікатори: дату народження,
                країну, адресу, реєстраційні дані та інші доступні відомості.

                Інформація формується на основі відкритих даних
                і не є юридичним висновком.

            </div>
        `;

        resultEl.innerHTML = html;

    } catch (error) {

        console.error("FinAP Check Error:", error);

        resultEl.innerHTML = `

            <div class="error">

                <strong>Помилка перевірки</strong>

                <div style="
                    margin-top:8px;
                    color:rgba(255,255,255,.65);
                    font-size:14px;
                ">

                    Не вдалося отримати відповідь від сервера перевірки.

                    <br><br>

                    Переконайтеся, що API FinAP запущений
                    на <strong>localhost:3001</strong>.

                </div>

            </div>
        `;

    } finally {

        button.disabled = false;

    }
}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


document.getElementById("name").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            check();
        }

    }
);

</script>

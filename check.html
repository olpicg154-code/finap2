<!DOCTYPE html>

<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinAP — Перевірка контрагента</title>

    ```
    <link rel="icon" href="/logo.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 10%, rgba(0, 140, 255, 0.14), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(0, 80, 180, 0.08), transparent 35%),
                #071126;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 60px 20px;
        }

        .container {
            max-width: 820px;
            margin: auto;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo img {
            width: 140px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, .6);
            margin-top: 10px;
        }

        .search-box {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .1);
            background: rgba(255, 255, 255, .05);
            color: white;
        }

        button {
            padding: 15px 25px;
            border-radius: 10px;
            border: none;
            background: #00d9ff;
            font-weight: bold;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
        }

        .summary {
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .summary-danger {
            background: rgba(255, 59, 48, .1);
        }

        .summary-warning {
            background: rgba(255, 159, 10, .1);
        }

        .summary-safe {
            background: rgba(48, 209, 88, .1);
        }

        .match {
            background: rgba(255, 255, 255, .05);
            padding: 18px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .risk {
            margin-top: 10px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #00d9ff;
        }
    </style>
    ```

</head>

<body>

    <div class="container">

        ```
        <div class="logo">
            <img src="/logo.png" alt="FinAP">
        </div>

        <h1>⚠️ Перевірка контрагента</h1>

        <div class="subtitle">
            Перевірка за відкритими санкційними даними
        </div>

        <div class="search-box">
            <input id="name" placeholder="Введіть ім’я або компанію">
            <button onclick="check()">Перевірити</button>
        </div>

        <div id="result"></div>

        <a href="index.html" class="back">← Назад</a>
        ```

    </div>

    <script>

        async function check() {

            const name = document.getElementById("name").value.trim();
            const result = document.getElementById("result");

            if (!name) {
                result.innerHTML = "Введіть ім’я";
                return;
            }

            result.innerHTML = "🔎 Перевірка...";

            try {

                const res = await fetch(`/api/check?name=${encodeURIComponent(name)}`);
                const data = await res.json();

                if (!data.results || data.results.length === 0) {
                    result.innerHTML = "<div class='summary summary-safe'>Нічого не знайдено</div>";
                    return;
                }

                let sanctions = data.results.filter(x => x.sanctions);
                let pep = data.results.filter(x => x.pep && !x.sanctions);

                let summaryClass = "summary-safe";
                let text = "Ризиків не знайдено";

                if (sanctions.length) {
                    summaryClass = "summary-danger";
                    text = "🔴 Виявлено санкції";
                } else if (pep.length) {
                    summaryClass = "summary-warning";
                    text = "🟠 Виявлено PEP";
                }

                let html = `<div class="summary ${summaryClass}">${text}</div>`;

                data.results.forEach(item => {

                    html += `
                <div class="match">
                    <strong>${item.name}</strong>
                    <div>Країна: ${item.country || "—"}</div>
                    <div>Статус: ${item.position || "—"}</div>

                    <div class="risk">
                        Санкції: ${item.sanctions ? "❌ ТАК" : "✓ НІ"} |
                        PEP: ${item.pep ? "⚠️ ТАК" : "✓ НІ"}
                    </div>
                </div>
            `;
                });

                result.innerHTML = html;

            } catch (e) {

                result.innerHTML = `
            <div class="summary summary-danger">
                ❌ Помилка API (перевір Vercel функцію)
            </div>
        `;
            }
        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinAP News</title>

<style>

body {
    background: #0a1230;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.header img {
    height: 45px;
}

.back {
    padding: 12px 25px;
    border-radius: 30px;
    border: 1px solid #00eaff;
    color: white;
    text-decoration: none;
}

.back:hover {
    background: rgba(0,234,255,.1);
}

h2 {
    display: flex;
    align-items: center;
}

#newsCount {
    background: red;
    border-radius: 50%;
    padding: 4px 8px;
    font-size: 12px;
    margin-left: 10px;
}

.main-news {
    background: linear-gradient(135deg, #182cff, #00d9ff);
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    cursor: pointer;
}

.card {
    background: #111a3a;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    cursor: pointer;
    position: relative;
}

.title {
    font-weight: bold;
    font-size: 18px;
}

.short {
    margin-top: 10px;
    opacity: .85;
}

.meta {
    color: #00eaff;
    font-size: 12px;
    margin-top: 10px;
}

.top-label {
    position: absolute;
    right: 10px;
    top: 10px;
    background: #ffd700;
    color: black;
    padding: 5px 10px;
    border-radius: 15px;
    font-size: 11px;
}

.new {
    position: absolute;
    right: 10px;
    bottom: 10px;
    background: red;
    padding: 5px 10px;
    border-radius: 10px;
    font-size: 11px;
}

</style>

</head>

<body>

<div class="header">

    <img src="logo.png" alt="FinAP">

    <a href="index.html" class="back">
        ← На головну
    </a>

</div>

<h2>

    FinAP News

    <span id="newsCount"></span>

</h2>

<div id="main"></div>

<div id="news"></div>

<script>

const viewed =
    JSON.parse(localStorage.getItem("viewedNews") || "[]");

fetch("data/news.json")

    .then(res => res.json())

    .then(data => {

        const main = document.getElementById("main");
        const news = document.getElementById("news");

        let count = 0;

        data.forEach(item => {

            const isNew = !viewed.includes(item.title);

            if (isNew) count++;

            if (item.top === "main") {

                const div = document.createElement("div");

                div.className = "main-news";

                div.innerHTML = `
                    <div class="title">
                        ${item.title}
                    </div>

                    <div class="short">
                        ${item.short || ""}
                    </div>

                    <div class="meta">
                        ${item.date} | ${item.category}
                    </div>
                `;

                div.onclick = () => openArticle(item);

                main.appendChild(div);

                return;
            }

            const div = document.createElement("div");

            div.className = "card";

            div.innerHTML = `

                ${item.top === "top"
                    ? '<div class="top-label">⭐ TOP 3</div>'
                    : ""}

                ${isNew
                    ? '<div class="new">NEW</div>'
                    : ""}

                <div class="title">
                    ${item.title}
                </div>

                <div class="short">
                    ${item.short || ""}
                </div>

                <div class="meta">
                    ${item.date} | ${item.category}
                </div>

            `;

            div.onclick = () => openArticle(item);

            news.appendChild(div);

        });

        document.getElementById("newsCount").innerText =
            count ? "+" + count : "";

    })

    .catch(() => {

        document.body.innerHTML =
            "Помилка завантаження новин";

    });


function openArticle(item) {

    let viewed =
        JSON.parse(localStorage.getItem("viewedNews") || "[]");

    if (!viewed.includes(item.title)) {

        viewed.push(item.title);

        localStorage.setItem(
            "viewedNews",
            JSON.stringify(viewed)
        );

    }

    localStorage.setItem(
        "article",
        JSON.stringify(item)
    );

    window.location.href = "article.html";

}

</script>

</body>

</html>

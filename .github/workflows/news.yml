name: FinAP Auto News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Run engine
        run: node js/news-engine.js

      - name: Commit changes
        run: |
          git config user.name "finap-bot"
          git config user.email "bot@finap.com"
          git add data/news.json
          git commit -m "🤖 Auto update news" || echo "No changes"
          git push

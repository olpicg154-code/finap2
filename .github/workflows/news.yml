name: FinAP Auto News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Run engine
        run: node js/news-engine.js

      - name: Commit & Push
        run: |
          git config --global user.name "finap-bot"
          git config --global user.email "bot@finap.com"

          git add data/news.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto update news"
            git push
          fi
